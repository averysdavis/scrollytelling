project:
  type: website
  # Rebuild the Chinese font subsets from the characters in the stories
  pre-render: theme/subset-chinese.py
  resources:
    - theme/fonts/zh-sc-subset.woff2
    - theme/fonts/zh-tc-subset.woff2
    - theme/fonts/LibreBaskerville-VF.ttf
    - theme/fonts/LibreBaskerville-Italic-VF.ttf
    - theme/fonts/LibreBaskerville-OFL.txt

website:
  title: "Avery Davis"
  site-url: https://averysdavis.com/scrollytelling/
  open-graph: true
  twitter-card: true

execute:
  freeze: auto

format:
  closeread-html:
    # Site colours and the light/dark toggle, shared by every story
    css: theme/site-theme.css
    include-in-header: theme/theme-init.html
    include-after-body: theme/theme-toggle.html
